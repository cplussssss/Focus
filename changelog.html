<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>" />
  <title>開發日記 — 番茄</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #1a1a1a;
      font-family: 'Georgia', 'Noto Serif TC', serif;
      font-size: 18px;
      line-height: 1.7;
    }

    /* 頁面容器：模擬 A4 紙感 */
    .cl-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 60px 80px;
      min-height: 100vh;
    }

    /* 頂部導覽 */
    .cl-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 10px;
      margin-bottom: 36px;
    }
    .cl-nav-title {
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      color: #555;
    }
    .cl-back {
      font-size: .78rem;
      color: #555;
      text-decoration: none;
      font-family: Arial, sans-serif;
      letter-spacing: .04em;
    }
    .cl-back:hover { color: #000; text-decoration: underline; }

    /* Markdown 內容 */
    .cl-body h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 4px;
      line-height: 1.25;
      letter-spacing: -.01em;
    }

    /* h1 下的副標題感橫線 */
    /* .cl-body h1 + p,
    .cl-body h1 + blockquote {
      color: #555;
      font-size: .9rem;
      margin-top: 0;
    } */

    .cl-body h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 20px 0 8px;
      font-family: Arial, sans-serif;
      letter-spacing: .02em;
    }

    .cl-body h3 {
      font-size: .92rem;
      font-weight: 700;
      margin: 20px 0 6px;
      font-family: Arial, sans-serif;
    }

    .cl-body p {
      margin: 0 0 12px;
      color: #222;
    }

    .cl-body ul, .cl-body ol {
      margin: 0 0 14px;
      padding-left: 22px;
    }
    .cl-body li {
      margin-bottom: 4px;
      color: #222;
    }

    .cl-body strong { font-weight: 700; }

    .cl-body hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 28px 0 0;
    }

    .cl-body blockquote {
      margin: 12px 0 16px 0;
      padding: 0 0 0 16px;
      border-left: 3px solid #bbb;
      color: #555;
      font-style: italic;
      font-size: .9rem;
    }

    .cl-body code {
      font-family: 'Courier New', monospace;
      font-size: .82rem;
      background: #f2f2f2;
      padding: 1px 5px;
      border-radius: 2px;
      color: #c0392b;
    }

    /* 表格 */
    .cl-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 20px;
      font-size: .88rem;
      font-family: Arial, sans-serif;
    }
    .cl-body th {
      text-align: left;
      padding: 7px 12px;
      background: #1a1a1a;
      color: #fff;
      font-weight: 600;
      font-size: .8rem;
      letter-spacing: .04em;
    }
    .cl-body td {
      padding: 7px 12px;
      border-bottom: 1px solid #e0e0e0;
      color: #222;
      vertical-align: top;
    }
    .cl-body tr:last-child td { border-bottom: none; }
    .cl-body tr:nth-child(even) td { background: #fafafa; }

    /* 頁腳頁碼感 */
    .cl-footer {
      margin-top: 60px;
      padding-top: 12px;
      border-top: 1px solid #ccc;
      font-size: .75rem;
      color: #999;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: space-between;
    }

    .cl-loading { color: #888; font-size: .88rem; font-family: Arial, sans-serif; }
    .cl-error   { color: #c0392b; font-size: .88rem; font-family: Arial, sans-serif; }

    @media (max-width: 900px) {
      .cl-page { padding: 32px 32px 60px; }
    }
    @media (max-width: 600px) {
      .cl-page { padding: 20px 16px 60px; }
    }

    @media print {
      .cl-nav, .cl-footer { display: none; }
      .cl-page { padding: 0; }
    }
  </style>
</head>
<body>
<div class="cl-page">

  <nav class="cl-nav">
    <span class="cl-nav-title">番茄鐘 · 開發日記</span>
    <a href="index.html" class="cl-back">← 回番茄鐘</a>
  </nav>

  <div class="cl-body" id="clBody">
    <p class="cl-loading">載入中…</p>
  </div>

  <footer class="cl-footer">
    <span>Focus — 番茄鐘 &amp; 今日計畫</span>
    <span id="clFooterDate"></span>
  </footer>

</div>

<script>
  // 固定白底，標記已讀
  (function () {
    // 標記已讀：版本號要跟 index.html 裡的 LATEST_VER 一致
    var LATEST = 'v0.3';
    localStorage.setItem('cl-seen', LATEST);

    // 頁腳日期
    var d = new Date();
    var pad = n => String(n).padStart(2,'0');
    document.getElementById('clFooterDate').textContent =
      d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  })();

  // 讀取並渲染 changelog.md
  fetch('changelog.md')
    .then(res => {
      if (!res.ok) throw new Error('載入失敗');
      return res.text();
    })
    .then(md => {
      document.getElementById('clBody').innerHTML = marked.parse(md);
    })
    .catch(err => {
      document.getElementById('clBody').innerHTML =
        `<p class="cl-error">⚠ 無法載入內容：${err.message}</p>`;
    });
</script>
</body>
</html>
