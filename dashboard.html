<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>" />
  <title>我的學習儀表板</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── 整體版面 ── */
    .dash-layout {
      display: flex;
      height: 100vh;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    /* ── 左欄：固定寬度，不滾動 ── */
    .dash-left {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .dash-left::-webkit-scrollbar { width: 3px; }
    .dash-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── 右欄：歷史紀錄，獨立滾動 ── */
    .dash-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dash-right-inner {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .dash-right-inner::-webkit-scrollbar { width: 3px; }
    .dash-right-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── 通用卡片 ── */
    .dash-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }
    .dash-card-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
    }

    /* ── 頁首：返回 + 用戶 ── */
    .dash-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 4px;
    }
    .dash-header .btn-theme-toggle { margin-left: auto; }
    .dash-back {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .dash-back:hover { color: var(--text-primary); }
    .dash-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }
    .dash-username {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── 今日進度 ── */
    .today-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .today-stat { text-align: center; }
    .today-stat-num {
      font-family: var(--font-mono);
      font-size: 1.7rem;
      font-weight: 500;
      color: var(--tomato-light);
      line-height: 1;
    }
    .today-stat-label {
      font-size: 0.67rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── 連續天數 ── */
    .streak-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .streak-num {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--tomato-light);
      line-height: 1;
    }
    .streak-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ── AI 洞察 ── */
    #aiInsightText {
      font-size: 0.85rem;
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 36px;
    }
    .ai-loading { color: var(--text-muted); }
    .ai-error   { color: #e85d3a; font-size: 0.82rem; }

    /* ── 本週圖 ── */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .week-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .week-bar {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 5px;
    }
    .week-label {
      font-size: 0.67rem;
      color: var(--text-muted);
    }
    .week-min {
      font-size: 0.6rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ── 分類 ── */
    .cat-row {
      display: grid;
      grid-template-columns: 52px 1fr 36px;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .cat-name {
      font-size: 0.78rem;
      color: var(--text-primary);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cat-bar-bg {
      background: var(--bg-input);
      border-radius: 4px;
      height: 7px;
      overflow: hidden;
    }
    .cat-bar-fill {
      height: 100%;
      background: var(--tomato-light);
      border-radius: 4px;
      transition: width 0.6s ease;
    }
    .cat-pct {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ── 右欄：歷史紀錄標題 ── */
    .dash-right-header {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0 4px 10px;
      flex-shrink: 0;
    }
    .history-day-group { margin-bottom: 16px; }
    .history-day-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 7px;
    }
    .history-day-total {
      font-family: var(--font-mono);
      color: var(--tomato-light);
    }

    /* ── 手機版（≤ 700px）：改成上下排列 ── */
    @media (max-width: 700px) {
      html, body { overflow: auto; height: auto; }

      .dash-layout {
        flex-direction: column;
        height: auto;
        overflow: visible;
        padding: 12px;
        gap: 12px;
      }
      .dash-left {
        width: 100%;
        overflow: visible;
      }
      .dash-right {
        overflow: visible;
      }
      .dash-right-inner {
        overflow: visible;
        max-height: none;
      }
      .today-stat-num { font-size: 1.4rem; }
      .streak-num     { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="dash-layout">

    <!-- ══ 左欄 ══ -->
    <div class="dash-left">

      <!-- 返回 + 用戶 -->
      <div class="dash-header">
        <a href="index.html" class="dash-back">← 番茄鐘</a>
        <img id="dashAvatar" class="dash-avatar" src="" alt="" hidden />
        <div class="dash-username" id="dashUserName">載入中...</div>
        <button type="button" class="btn-theme-toggle" id="btnThemeToggle" title="切換深/淺色">🌙</button>
      </div>

      <!-- 今日進度 -->
      <div class="dash-card">
        <div class="dash-card-title">今日進度</div>
        <div class="today-stats">
          <div class="today-stat">
            <div class="today-stat-num" id="todayMinutes">—</div>
            <div class="today-stat-label">專注分鐘</div>
          </div>
          <div class="today-stat">
            <div class="today-stat-num" id="todayRounds">—</div>
            <div class="today-stat-label">完成輪數</div>
          </div>
          <div class="today-stat">
            <div class="today-stat-num" id="todayRate">—</div>
            <div class="today-stat-label">完成率</div>
          </div>
        </div>
      </div>

      <!-- 連續天數 -->
      <div class="dash-card">
        <div class="dash-card-title">🔥 連續天數</div>
        <div class="streak-row">
          <div class="streak-num" id="streakCount">—</div>
          <div class="streak-sub">天連續有紀錄</div>
        </div>
      </div>

      <!-- AI 洞察 -->
      <div class="dash-card">
        <div class="dash-card-title">🤖 AI 習慣洞察</div>
        <div id="aiInsightText"><span class="ai-loading">載入中...</span></div>
      </div>

      <!-- 本週圖 -->
      <div class="dash-card">
        <div class="dash-card-title">本週每日專注</div>
        <div class="week-grid" id="weeklyChart"></div>
      </div>

      <!-- 分類 -->
      <div class="dash-card">
        <div class="dash-card-title">任務分類分佈</div>
        <div id="categoryList"></div>
      </div>

    </div><!-- /.dash-left -->

    <!-- ══ 右欄：歷史紀錄 ══ -->
    <div class="dash-right">
      <div class="dash-right-header">📋 歷史紀錄</div>
      <div class="dash-right-inner" id="dashHistoryList">
        <p class="empty-hint">載入中...</p>
      </div>
    </div><!-- /.dash-right -->

  </div><!-- /.dash-layout -->

  <script>
    (function() {
      var btn = document.getElementById('btnThemeToggle');
      var saved = localStorage.getItem('theme') || 'dark';
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        if (btn) btn.textContent = '☀️';
      }
      if (btn) btn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        if (current === 'light') {
          document.documentElement.removeAttribute('data-theme');
          btn.textContent = '🌙';
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          btn.textContent = '☀️';
          localStorage.setItem('theme', 'light');
        }
      });
    })();
  </script>
  <script src="dashboard.js"></script>
</body>
</html>
