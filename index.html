<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  <title>Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>

<body>

  <!-- ── 右上角 Auth 按鈕 ── -->
  <div class="auth-corner">
    <button type="button" class="btn-auth-login" id="btnAuthLogin">登入</button>
    <div id="authUserArea" class="auth-user-area" hidden>
      <button type="button" class="btn-auth-user" id="btnAuthUser">
        <img class="auth-avatar" id="authAvatar" src="" alt="" hidden />
        <span id="authName"></span>
      </button>
      <div class="auth-dropdown" id="authDropdown">
        <button type="button" class="btn-auth-logout" id="btnAuthLogout">登出</button>
      </div>
    </div>
  </div>

  <header class="header fade-up">
    <p class="eyebrow">focus / tools</p>
    <h1 class="title">Your tools,<br><em>one place.</em></h1>
    <p class="subtitle">個人效率工具集</p>
  </header>

  <main class="tools-grid" role="main">
    <a class="tool-card fade-up delay-1" href="./pomodoro/">
      <div class="card-accent accent-tomato-bar"></div>
      <div class="card-icon icon-tomato">🍅</div>
      <p class="card-name">Pomodoro</p>
      <p class="card-desc">專注計時器，搭配習慣追蹤與狀態偵測</p>
    </a>

    <a class="tool-card fade-up delay-2" href="./toeicprep/">
      <div class="card-accent accent-teal-bar"></div>
      <div class="card-icon icon-teal">📚</div>
      <p class="card-name">TOEIC Prep</p>
      <p class="card-desc">讀書計畫、錯題筆記、每日檢核表</p>
    </a>

    <a class="tool-card fade-up delay-3" href="./speaking/">
      <div class="card-accent accent-purple-bar"></div>
      <div class="card-icon icon-purple">🎙️</div>
      <p class="card-name">英文口說練習</p>
      <p class="card-desc">提升口語表達能力</p>
    </a>
  </main>

  <footer class="footer fade-up delay-4" aria-label="頁尾">
    <span>side projects</span>
    <span id="yr"></span>
  </footer>

  <script src="script.js"></script>

  <!-- ── 登入 Modal ── -->
  <div class="modal-overlay" id="modalLogin">
    <div class="modal">
      <button type="button" class="modal-close" id="btnCloseLogin" aria-label="關閉">✕</button>
      <div class="modal-icon">🔑</div>
      <h2 class="modal-title">登入</h2>
      <p class="modal-subtitle">登入後可使用所有 AI 功能，並同步你的資料到雲端</p>
      <button type="button" class="btn-login btn-google-login" id="btnGoogleLogin">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        使用 Google 帳號登入
      </button>
      <div class="modal-divider"></div>
      <p class="modal-note">不登入也可以使用基本功能</p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    (function () {
      var modal = document.getElementById('modalLogin');
      var btnLogin = document.getElementById('btnAuthLogin');
      var userArea = document.getElementById('authUserArea');
      var nameEl = document.getElementById('authName');
      var avatarEl = document.getElementById('authAvatar');

      function openModal() { modal.classList.add('open'); }
      function closeModal() { modal.classList.remove('open'); }

      FocusAuth.onAuthChange(function (user) {
        if (user) {
          btnLogin.hidden = true;
          userArea.hidden = false;
          nameEl.textContent = user.name ? user.name.split(' ')[0] : (user.email || '');
          if (user.picture) { avatarEl.src = user.picture; avatarEl.hidden = false; }
          else { avatarEl.hidden = true; }
          closeModal();
        } else if (user === null) {
          btnLogin.hidden = false;
          userArea.hidden = true;
        }
      });

      btnLogin.addEventListener('click', openModal);
      document.getElementById('btnCloseLogin').addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });

      document.getElementById('btnGoogleLogin').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = '登入中...';
        FocusAuth.signInWithGoogle().catch(function (e) {
          btn.disabled = false;
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.382.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> 使用 Google 帳號登入';
          if (e.code !== 'auth/popup-closed-by-user') {
            console.error('登入失敗', e);
          }
        });
      });

      // // Dropdown toggle
      // var btnAuthUser = document.getElementById('btnAuthUser');
      // var authDropdown = document.getElementById('authDropdown');

      // btnAuthUser.addEventListener('click', function (e) {
      //   e.stopPropagation();
      //   authDropdown.classList.toggle('open');
      // });

      // // 點其他地方關閉
      // document.addEventListener('click', function () {
      //   authDropdown.classList.remove('open');
      // });

      document.getElementById('btnAuthLogout').addEventListener('click', function () {
        FocusAuth.signOut();
      });
    })();
  </script>
</body>

</html>
