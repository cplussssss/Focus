<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ee;
      --bg-card: #ffffff;
      --text-primary: #1a1917;
      --text-secondary: #6b6860;
      --text-tertiary: #a09d97;
      --border: rgba(26,25,23,0.1);
      --border-hover: rgba(26,25,23,0.2);
      --accent-tomato: #D85A30;
      --accent-teal: #1D9E75;
      --accent-purple: #7F77DD;
      --modal-overlay: rgba(26,25,23,0.5);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Page load animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease both; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.32s; }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 0.75rem;
    }
    .title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(40px, 6vw, 58px);
      font-weight: 400;
      line-height: 1.05;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .title em {
      font-style: italic;
      color: var(--text-secondary);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-tertiary);
      font-weight: 300;
    }

    /* ── Grid ── */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 660px;
    }

    /* ── Tool card ── */
    .tool-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.25rem 1.25rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: block;
      position: relative;
      overflow: hidden;
    }
    .tool-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(26,25,23,0.07);
    }
    .tool-card:active { transform: translateY(0); }

    .card-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 16px 16px 0 0;
    }
    .accent-tomato-bar { background: var(--accent-tomato); }
    .accent-teal-bar   { background: var(--accent-teal); }
    .accent-purple-bar { background: var(--accent-purple); }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 18px;
    }
    .icon-tomato { background: #fdf0eb; color: var(--accent-tomato); }
    .icon-teal   { background: #e8f7f2; color: var(--accent-teal); }
    .icon-dashed { background: #f5f3ee; color: var(--text-tertiary); }

    .card-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.6;
      font-weight: 300;
    }
    .card-tag {
      display: inline-block;
      margin-top: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 100px;
      border: 0.5px solid var(--border);
      color: var(--text-tertiary);
    }

    .card-placeholder {
      border-style: dashed;
      opacity: 0.45;
      cursor: default;
    }
    .card-placeholder:hover {
      transform: none;
      box-shadow: none;
      border-color: var(--border);
    }

    /* ── Footer ── */
    .footer {
      margin-top: 2.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-tertiary);
      display: flex;
      gap: 1.5rem;
    }

    /* ── Modal overlay ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      position: relative;
      transform: translateY(12px);
      transition: transform 0.25s ease;
    }
    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: var(--text-primary); background: var(--bg); }

    .modal-icon {
      width: 48px;
      height: 48px;
      background: #e8f7f2;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 1.25rem;
    }
    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }
    .modal-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
      line-height: 1.6;
      font-weight: 300;
    }

    /* Google login button */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-hover);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .btn-google:hover { background: var(--bg); border-color: var(--border-hover); }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .google-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Status messages */
    .modal-status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    .modal-status.error {
      display: block;
      background: #fdf0eb;
      color: #99390f;
      border: 0.5px solid #f0b99e;
    }
    .modal-status.loading {
      display: block;
      background: var(--bg);
      color: var(--text-secondary);
      border: 0.5px solid var(--border);
    }

    .modal-divider {
      height: 0.5px;
      background: var(--border);
      margin: 1.25rem 0;
    }
    .modal-note {
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: center;
      font-weight: 300;
    }
    .modal-note a {
      color: var(--accent-teal);
      text-decoration: none;
    }
    .modal-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header class="header fade-up">
    <p class="eyebrow">focus / tools</p>
    <h1 class="title">Your tools,<br><em>one place.</em></h1>
    <p class="subtitle">個人效率工具集</p>
  </header>

  <main class="tools-grid" role="main">
    <!-- Pomodoro -->
    <a class="tool-card fade-up delay-1" href="./pomodoro/">
      <div class="card-accent accent-tomato-bar"></div>
      <div class="card-icon icon-tomato">🍅</div>
      <p class="card-name">Pomodoro</p>
      <p class="card-desc">專注計時器，搭配習慣追蹤與狀態偵測</p>
      <span class="card-tag">firebase</span>
    </a>

    <!-- TOEIC Prep — triggers login modal -->
    <button class="tool-card fade-up delay-2" id="toeic-btn" onclick="openModal()" aria-haspopup="dialog">
      <div class="card-accent accent-teal-bar"></div>
      <div class="card-icon icon-teal">📚</div>
      <p class="card-name">TOEIC Prep</p>
      <p class="card-desc">11 週讀書計畫、錯題筆記、每日檢核表</p>
      <span class="card-tag">supabase</span>
    </button>

    <!-- Placeholder -->
    <div class="tool-card card-placeholder fade-up delay-3" aria-hidden="true">
      <div class="card-icon icon-dashed">＋</div>
      <p class="card-name">下一個工具</p>
      <p class="card-desc">新增資料夾即可加入</p>
    </div>
  </main>

  <footer class="footer fade-up delay-4" aria-label="頁尾">
    <span>focus · side projects</span>
    <span id="yr"></span>
  </footer>

  <!-- ── Login Modal ── -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()" aria-label="關閉">✕</button>

      <div class="modal-icon">📚</div>
      <h2 class="modal-title" id="modal-title">TOEIC Prep</h2>
      <p class="modal-subtitle" id="modal-subtitle">這是個人備考工具，請用 Google 帳號登入以繼續。</p>

      <button class="btn-google" id="login-btn" onclick="signInWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        使用 Google 帳號登入
      </button>

      <div class="modal-status" id="modal-status"></div>

      <div class="modal-divider"></div>
      <p class="modal-note" id="modal-note">登入即代表你同意個人資料僅用於本工具</p>
    </div>
  </div>



  <script>
    // ── Config ──
    const SUPABASE_URL = 'https://ujpwqxxriimtxsjconfk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqcHdxeHhyaWltdHhzamNvbmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDM5NjIsImV4cCI6MjA5NjExOTk2Mn0.PW8o1O7-kTC_Nl1wN39sqMOwN2H_CNtEKORmEe_u-rA';
    const ALLOWED_EMAIL = 'sijialai1473@gmail.com';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── Year ──
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ── Modal ──
    function openModal() {
      document.getElementById('modal-overlay').classList.add('open');
      document.getElementById('modal-status').className = 'modal-status';
      document.getElementById('modal-status').textContent = '';
      document.getElementById('login-btn').disabled = false;
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
    }

    // Close on overlay click
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // Close on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // ── Google Sign In ──
    async function signInWithGoogle() {
      const btn = document.getElementById('login-btn');
      const status = document.getElementById('modal-status');

      btn.disabled = true;
      status.className = 'modal-status loading';
      status.textContent = '正在跳轉到 Google 登入…';

      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });

      if (error) {
        btn.disabled = false;
        status.className = 'modal-status error';
        status.textContent = '登入失敗，請稍後再試。';
      }
    }

    // ── Handle OAuth callback ──
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session) {
        const email = session.user.email;

        if (email === ALLOWED_EMAIL) {
          // Correct user → go to toeicprep
          window.location.href = './toeicprep/';
        } else {
          // Wrong user → show message, sign out
          await supabase.auth.signOut();
          openModal();

          const status = document.getElementById('modal-status');
          const subtitle = document.getElementById('modal-subtitle');
          const btn = document.getElementById('login-btn');
          const note = document.getElementById('modal-note');

          subtitle.textContent = '這個工具目前是私人使用的備考網站。';
          status.className = 'modal-status error';
          status.textContent = '如果有需要，可以跟我聯繫並製作個人化的備考網站 ✉️';
          btn.disabled = false;
          note.innerHTML = '聯繫方式：<a href="mailto:sijialai1473@gmail.com">sijialai1473@gmail.com</a>';
        }
      }
    });
  </script>
</body>
</html>
