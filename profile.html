<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>" />
  <title>番茄鐘 — 個人紀錄</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* profile 頁面專用樣式 */
    .profile-wrapper {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg-input);
      border: 2px solid var(--border);
      object-fit: cover;
    }
    .profile-avatar-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--tomato-dim);
      border: 2px solid var(--tomato);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }
    .profile-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .profile-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .profile-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .profile-back:hover { color: var(--text-primary); }

    .profile-summary {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .profile-stat { text-align: center; }
    .profile-stat-num {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--tomato-light);
      line-height: 1;
    }
    .profile-stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .profile-records {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border);
    }
    .profile-records h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .loading-hint {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 0;
      font-size: 0.9rem;
    }
    .error-hint {
      text-align: center;
      color: #e85d3a;
      padding: 32px 0;
      font-size: 0.9rem;
    }

    @media (max-width: 480px) {
      .profile-summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="profile-wrapper">

    <!-- 返回按鈕 -->
    <a href="index.html" class="profile-back">← 回到番茄鐘</a>

    <!-- 用戶資訊區 -->
    <div class="profile-header" id="profileHeader">
      <div class="loading-hint">載入中...</div>
    </div>

    <!-- 統計摘要 -->
    <div class="profile-summary" id="profileSummary" hidden>
      <div class="profile-stat">
        <div class="profile-stat-num" id="pTotalRounds">0</div>
        <div class="profile-stat-label">總完成輪數</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-num" id="pTotalMinutes">0</div>
        <div class="profile-stat-label">總專注分鐘</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-num" id="pDoneRate">—</div>
        <div class="profile-stat-label">完成率</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-num" id="pAvgFocus">—</div>
        <div class="profile-stat-label">平均專注度</div>
      </div>
    </div>

    <!-- 歷史紀錄 -->
    <div class="profile-records">
      <h2>📋 學習紀錄</h2>
      <div id="profileHistoryList">
        <div class="loading-hint">載入中...</div>
      </div>
    </div>

  </div>

  <script src="profile.js"></script>
</body>
</html>
