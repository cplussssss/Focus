<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<title>Voc</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/voc.css">
<script src="../auth.js"></script>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="https://cplussssss.github.io/Focus" class="nav-home">F</a>
    <span class="nav-logo">TOEIC Practice</span>
  </div>
  <div class="nav-links">
    <a href="index.html">口說練習</a>
    <a href="news.html">新聞閱讀</a>
    <a href="voc.html" class="active">單字庫</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title">My Vocabulary</h1>
      <p class="word-count" id="word-count">載入中...</p>
    </div>
    <div class="view-toggle">
      <button type="button" class="view-btn active" data-view="cards" onclick="setView('cards')">卡片</button>
      <button type="button" class="view-btn" data-view="flip" onclick="setView('flip')">翻轉測驗</button>
    </div>
  </div>

  <div class="toolbar">
    <input class="search-box" id="search" placeholder="搜尋單字..." oninput="filterWords()">
    <select class="sort-select" id="sort-sel" title="排序方式" onchange="renderWords()">
      <option value="newest">最新加入</option>
      <option value="oldest">最早加入</option>
      <option value="alpha">A → Z</option>
    </select>
    <button type="button" class="btn-secondary" onclick="loadWords()">重新整理</button>
    <button type="button" class="btn-primary" onclick="openAddModal()">＋ 新增單字</button>
  </div>

  <div id="word-container"></div>
</div>

<!-- Add Word Modal -->
<div class="modal-overlay" id="add-modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">新增單字</h2>
      <button type="button" class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <label class="modal-label">單字 <span class="required">*</span></label>
      <input class="modal-input" id="new-word" placeholder="e.g. ephemeral" autocomplete="off">
      <label class="modal-label">中文解釋</label>
      <input class="modal-input" id="new-zh" placeholder="e.g. 短暫的">
      <label class="modal-label">英文解釋</label>
      <input class="modal-input" id="new-en" placeholder="e.g. lasting for a very short time">
      <label class="modal-label">例句</label>
      <textarea class="modal-input modal-textarea" id="new-example" placeholder="e.g. The ephemeral beauty of cherry blossoms..."></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" onclick="closeAddModal()">取消</button>
      <button type="button" class="btn-primary" id="save-btn" onclick="saveNewWord()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/voc.js"></script>
</body>
</html>
